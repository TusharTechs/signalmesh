<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" width="760" height="150" role="img" aria-label="SignalMesh">
  <defs>
    <linearGradient id="smGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- mark: three-node mesh reaching consensus, with a signal pulse -->
  <g transform="translate(18, 21)">
    <!-- mesh edges -->
    <g stroke="url(#smGrad)" stroke-width="5.5" stroke-linecap="round" fill="none" opacity="0.75">
      <line x1="54" y1="16" x2="16" y2="86"/>
      <line x1="54" y1="16" x2="92" y2="86"/>
      <line x1="16" y1="86" x2="92" y2="86"/>
    </g>

    <!-- outer signal arc -->
    <path d="M 92 22 A 50 50 0 0 1 92 84" stroke="url(#smGrad)" stroke-width="5"
          stroke-linecap="round" fill="none" opacity="0.35"/>

    <!-- nodes -->
    <circle cx="16" cy="86" r="11" fill="url(#smGrad)"/>
    <circle cx="92" cy="86" r="11" fill="url(#smGrad)"/>
    <!-- lead node: hollow ring = healthy, under observation -->
    <circle cx="54" cy="16" r="13" fill="none" stroke="url(#smGrad)" stroke-width="7"/>
  </g>

  <!-- wordmark -->
  <text x="152" y="97"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="66" font-weight="300" letter-spacing="7" fill="#71717a">SIGNAL<tspan
        font-weight="700" fill="url(#smGrad)">MESH</tspan></text>
</svg>
